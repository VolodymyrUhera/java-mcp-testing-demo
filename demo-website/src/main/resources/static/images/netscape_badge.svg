<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 15" width="80" height="15" role="img" aria-labelledby="ns-title ns-desc">
  <title id="ns-title">Netscape 4.0 Web Badge</title>
  <desc id="ns-desc">80x15 pixel retro web button reading NETSCAPE 4.0 with navy background and cyan border.</desc>
  
  <!-- Outer Frame with 3D Bevel -->
  <rect width="80" height="15" fill="#000080" stroke="#00ffff" stroke-width="1"/>
  <line x1="0" y1="0" x2="80" y2="0" stroke="#00ffff" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="15" stroke="#00ffff" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="15" stroke="#004080" stroke-width="1"/>
  <line x1="0" y1="15" x2="80" y2="15" stroke="#004080" stroke-width="1"/>
  
  <!-- Left Side Logo Box: Netscape 'N' -->
  <rect x="2" y="2" width="11" height="11" fill="#008080"/>
  <!-- Netscape 'N' shape -->
  <path d="M 4,11 V 4 L 9,11 V 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="square"/>
  <circle cx="9.5" cy="4.5" r="0.75" fill="#00ffff"/>
  
  <!-- Vertical Divider Line -->
  <line x1="15" y1="1" x2="15" y2="14" stroke="#00ffff" stroke-width="1"/>
  
  <!-- Text: NETSCAPE 4.0 -->
  <text x="47" y="11" font-family="'Courier New', 'MS Sans Serif', monospace" font-size="8.5" font-weight="bold" fill="#00ffff" text-anchor="middle">NETSCAPE 4.0</text>
</svg>
