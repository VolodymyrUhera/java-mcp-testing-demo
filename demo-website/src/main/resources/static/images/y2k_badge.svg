<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 15" width="80" height="15" role="img" aria-labelledby="y2k-title y2k-desc">
  <title id="y2k-title">Y2K Ready Web Badge</title>
  <desc id="y2k-desc">80x15 pixel retro web button with black background, neon green LED border, and glowing Y2K READY text.</desc>
  
  <!-- Black LED Frame -->
  <rect width="80" height="15" fill="#000000" stroke="#00ff00" stroke-width="1"/>
  
  <!-- Inner LED Border Lines -->
  <rect x="2" y="2" width="76" height="11" fill="#051505" stroke="#00aa00" stroke-width="0.5"/>
  
  <!-- Glowing Green LED Dot/Checkmark -->
  <circle cx="7" cy="7.5" r="2.5" fill="#00ff00"/>
  <circle cx="7" cy="7.5" r="1" fill="#ffffff"/>
  
  <!-- LED Text -->
  <text x="46" y="11" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00ff00" letter-spacing="0.5" text-anchor="middle">Y2K READY</text>
</svg>
