<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 40" width="250" height="40" role="img" aria-labelledby="const-title const-desc">
  <title id="const-title">Under Construction Hazard Tape Banner</title>
  <desc id="const-desc">Black and yellow diagonal hazard stripes border with bold 90s retro UNDER CONSTRUCTION banner text and warning sign icons.</desc>
  <defs>
    <pattern id="hazardStripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#ffff00"/>
      <rect x="10" width="10" height="20" fill="#000000"/>
    </pattern>
  </defs>
  
  <!-- Outer Hazard Border -->
  <rect width="250" height="40" fill="url(#hazardStripes)"/>
  
  <!-- Win98 Beveled Content Box -->
  <rect x="12" y="5" width="226" height="30" fill="#c0c0c0" stroke="#ffffff" stroke-width="2"/>
  <rect x="12" y="5" width="226" height="30" fill="none" stroke="#808080" stroke-width="2" stroke-dasharray="0,226,226,0"/>
  <rect x="14" y="7" width="222" height="26" fill="#000000"/>
  
  <!-- Warning Sign Icon Left -->
  <polygon points="26,11 36,29 16,29" fill="#ffff00" stroke="#000000" stroke-width="1"/>
  <text x="26" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">!</text>
  
  <!-- Retro Flaming / Bold Text -->
  <text x="125" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="bold" fill="#ff0000" letter-spacing="1" text-anchor="middle">UNDER CONSTRUCTION</text>
  <text x="124" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="bold" fill="#ffff00" letter-spacing="1" text-anchor="middle">UNDER CONSTRUCTION</text>
  
  <!-- Warning Sign Icon Right -->
  <polygon points="224,11 234,29 214,29" fill="#ffff00" stroke="#000000" stroke-width="1"/>
  <text x="224" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">!</text>
</svg>
