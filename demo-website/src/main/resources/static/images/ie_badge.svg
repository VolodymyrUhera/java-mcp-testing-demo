<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 15" width="80" height="15" role="img" aria-labelledby="ie-title ie-desc">
  <title id="ie-title">Internet Explorer 5.0 Web Badge</title>
  <desc id="ie-desc">80x15 pixel retro web button reading IE 5.0 with blue and silver background.</desc>
  <defs>
    <linearGradient id="ieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="35%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#002288"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Beveled Badge Container -->
  <rect width="80" height="15" fill="url(#ieGrad)"/>
  <line x1="0" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="15" stroke="#ffffff" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="15" stroke="#404040" stroke-width="1"/>
  <line x1="0" y1="15" x2="80" y2="15" stroke="#404040" stroke-width="1"/>
  
  <!-- IE 'e' Icon with Halo -->
  <ellipse cx="8" cy="7.5" rx="5" ry="3" fill="none" stroke="#ffcc00" stroke-width="1" transform="rotate(-25 8 7.5)"/>
  <text x="8" y="11" font-family="'Times New Roman', serif" font-size="11" font-style="italic" font-weight="bold" fill="#ffffff" text-anchor="middle">e</text>
  
  <!-- Divider -->
  <line x1="16" y1="1" x2="16" y2="14" stroke="#ffffff" opacity="0.6" stroke-width="1"/>
  
  <!-- Badge Text -->
  <text x="48" y="11" font-family="'MS Sans Serif', 'Arial', sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">IE 5.0 READY</text>
</svg>
