<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="globe-title globe-desc">
  <title id="globe-title">Retro Cyber Globe</title>
  <desc id="globe-desc">A glowing 1990s cyber globe with cyan and blue gradient background, bright latitude and longitude lines, and orbiting grid pixels.</desc>
  <defs>
    <radialGradient id="globeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="40%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#000044" />
    </radialGradient>
    <filter id="pixelGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#00ffff" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Cyber Ring / Bezel -->
  <rect x="1" y="1" width="78" height="78" fill="#000022" rx="4" stroke="#008080" stroke-width="2"/>
  <circle cx="40" cy="40" r="36" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Main Globe Body -->
  <circle cx="40" cy="40" r="32" fill="url(#globeGrad)" stroke="#00ffff" stroke-width="2" filter="url(#pixelGlow)"/>
  
  <!-- Latitude Lines (Ellipses) -->
  <ellipse cx="40" cy="40" rx="31" ry="11" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="40" cy="40" rx="27" ry="22" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.7"/>
  <line x1="8" y1="40" x2="72" y2="40" stroke="#ffff00" stroke-width="1.5"/>
  
  <!-- Longitude Lines -->
  <ellipse cx="40" cy="40" rx="11" ry="31" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.9"/>
  <ellipse cx="40" cy="40" rx="22" ry="27" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="8" x2="40" y2="72" stroke="#ffff00" stroke-width="1.5"/>
  
  <!-- Orbiting Pixel Satellites / Cyber Accents -->
  <rect x="68" y="24" width="4" height="4" fill="#ffff00"/>
  <rect x="10" y="52" width="4" height="4" fill="#ff00ff"/>
  <rect x="54" y="66" width="3" height="3" fill="#00ff00"/>
  <rect x="22" y="12" width="3" height="3" fill="#00ffff"/>
</svg>
